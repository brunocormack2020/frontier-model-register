[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organization-frontier-register"
version = "1.2.0"
description = "Review-assisted official-source monitoring, Excel export and Confluence publication for a model register"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "openpyxl>=3.1.5,<3.2", "PyYAML>=6.0.3,<7", "pypdf>=6.21.4,<7"]

[project.scripts]
frontier-register = "frontier_register.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
