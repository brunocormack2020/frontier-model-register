schema_version: 1
work_dir: work
output_dir: out
http_timeout_seconds: 30
max_source_bytes: 10000000
# Current-model sources are monitored by default. Prior rows remain in the outputs.
include_prior_sources: false
allowed_source_hosts:
  - www.anthropic.com
  - anthropic.com
  - www-cdn.anthropic.com
  - assets.claude.com
  - platform.claude.com
  - support.claude.com
  - claude.com
  - openai.com
  - www.openai.com
  - cdn.openai.com
  - deploymentsafety.openai.com
  - developers.openai.com
  - platform.openai.com
  - deepmind.google
  - storage.googleapis.com
  - ai.google.dev
  - aistudio.google.com
  - docs.cloud.google.com
  - cloud.google.com
  - blog.google
  - developers.google.com
  - developer.android.com
  - secgemini.google
  - docs.secgemini.google
watch_sources:
  - url: https://www.anthropic.com/system-cards
    kind: system_card_index
  - url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    kind: lifecycle_index
  - url: https://developers.openai.com/api/docs/models
    kind: model_catalog
  - url: https://developers.openai.com/api/docs/deprecations
    kind: lifecycle_index
  - url: https://deploymentsafety.openai.com/
    kind: system_card_index
  - url: https://deepmind.google/models/model-cards/
    kind: model_card_index
  - url: https://ai.google.dev/gemini-api/docs/deprecations
    kind: lifecycle_index
discovery:
  Anthropic:
    enabled: false
    prefixes: [claude-]
  OpenAI:
    enabled: false
    prefixes: [gpt-, o1, o3, o4]
  Google:
    enabled: false
    prefixes: [gemini-]
benchmarks:
  enabled: true
  refresh_with_sources: true
  core: [cybergym, exploitgym, cybergym_e2e, cyberbingym, cve_bench, cybench, agentdojo]
  # Initial selection only. Use benchmark-scope to change an initialized register.
  coding_in_scope: false
  soc_in_scope: false
  seed_files:
    - data/benchmark_results_seed.json
    - data/benchmark_evidence_seed.json
  max_cve_runs: 200
# Developer and curated Hugging Face model intelligence (read-only).
intelligence:
  enabled: true
  timeout_seconds: 20
  max_response_bytes: 3000000
  apis:
    mistral:
      enabled: false  # Set true and provide MISTRAL_API_KEY through the environment
    xai:
      enabled: false  # Set true and provide XAI_API_KEY through the environment
  huggingface:
    enabled: true
    # Exact repository metadata snapshots, without downloading model weights.
    repositories:
      - mistralai/Mistral-Small-3.1-24B-Instruct-2503
      - meta-llama/Llama-3.3-70B-Instruct
      - deepseek-ai/DeepSeek-R1
      - Qwen/Qwen3-32B
    # Bounded recent models; status is 'partial' if the publisher cap is reached.
    publishers:
      - name: mistralai
        prefixes: [Mistral, Mixtral, Codestral, Devstral, Magistral, Ministral, Pixtral]
        max_results: 10
      - name: meta-llama
        prefixes: [Llama, Meta-Llama]
        max_results: 10
      - name: deepseek-ai
        prefixes: [DeepSeek]
        max_results: 10
      - name: Qwen
        prefixes: [Qwen]
        max_results: 10

confluence:
  enabled: false
  mode: cloud
  base_url: https://your-company.atlassian.net/wiki
  page_id: "REPLACE_WITH_NUMERIC_PAGE_ID"
  auth_kind: auto
  token_env: CONFLUENCE_API_TOKEN
  username_env: CONFLUENCE_EMAIL
  timeout_seconds: 30
  include_prior_summary: true
