name: Python regression tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Compile source
        run: python -m compileall -q src run_register.py run_tests.py
      - name: Run offline regression tests
        run: python run_tests.py
